<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dulidan Web</title>
<link rel="stylesheet" href="home.css">
<script src="logo.js"></script>
<script src="home.js" defer></script>
</head>
<body class="intro">
  <canvas id="neb" class="neb"></canvas>
  <div class="grid" aria-hidden="true"></div>
  <canvas id="gl" class="gl"></canvas>

  <header class="hud">
    <div class="hud-l"><span class="dot"></span><span id="status">SYSTEM ONLINE</span><br><span class="dim"><b id="fps">60</b> FPS · <b id="tabs">1</b> TAB</span></div>
    <button class="hud-calc" id="calcBtn" aria-label="Rechner"><svg viewBox="0 0 24 24"><rect x="5" y="2.8" width="14" height="18.4" rx="2.6"/><path d="M8.4 6.4h7.2v3.2H8.4z"/><path d="M8.8 13.2h.01M12 13.2h.01M15.2 13.2h.01M8.8 16.8h.01M12 16.8h.01M15.2 16.8h.01" stroke-width="2.6"/></svg><span>RECHNER</span></button>
    <div class="hud-r"><div class="clock" id="clock">00:00</div><div class="dim" id="date"></div></div>
  </header>

  <main class="hero">
    <div class="stage" id="stage"><img id="fallback" alt="Dulidan"></div>
    <h1 class="title" id="title"><span class="w1">DULIDAN</span> <span class="w2">WEB</span></h1>
    <form class="bar" id="bar" autocomplete="off">
      <div class="beam" aria-hidden="true"></div>
      <div class="bar-in">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span class="chip" id="chip" hidden></span>
        <input id="q" type="text" placeholder="Suche oder Adresse …" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="go" type="submit" aria-label="Los"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </form>
    <button class="calcres" id="calcres" hidden></button>
    <div class="chips" id="chips"></div>
    <div class="cards" id="cards"></div>
  </main>

  <div class="band band-a" aria-hidden="true"><div class="track" id="bandA"></div></div>
  <div class="band band-b" aria-hidden="true"><div class="track rev" id="bandB"></div></div>
  <div class="flash" id="flash"></div>
</body>
</html>
