<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Dulidan Übersetzer</title>
<link rel="icon" href="../search/logo-mark.webp">
<link rel="stylesheet" href="translate.css">
<script type="module" src="translate.js"></script>
</head>
<body>
  <canvas id="bg" class="bg" aria-hidden="true"></canvas>
  <div class="grid" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="?" aria-label="Dulidan"><img src="../search/logo-mark.webp" alt=""><span>DULIDAN<i>TRANSLATE</i></span></a>
    <div class="engine mono" id="engine"></div>
  </header>

  <main class="stage" id="stage">
    <section class="card in-card">
      <div class="langs" id="fromLangs"></div>
      <textarea id="src" placeholder="Text eingeben …" spellcheck="false" autofocus></textarea>
      <div class="foot mono"><span id="count">0</span><button id="clear" class="ico" title="Leeren" aria-label="Leeren"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    </section>

    <button class="swap" id="swap" title="Sprachen tauschen" aria-label="Sprachen tauschen">
      <svg viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>
      <i class="beam" aria-hidden="true"></i>
    </button>

    <section class="card out-card" id="outCard">
      <div class="langs" id="toLangs"></div>
      <div class="out" id="out" aria-live="polite"><span class="ph">Übersetzung erscheint hier</span></div>
      <div class="status mono" id="status" hidden><i class="bar"></i><span id="statusT"></span></div>
      <div class="foot mono">
        <span id="via"></span>
        <span class="acts">
          <button id="speak" class="ico" title="Vorlesen" aria-label="Vorlesen"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
          <button id="copy" class="ico" title="Kopieren" aria-label="Kopieren"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
        </span>
      </div>
    </section>
  </main>
</body>
</html>
