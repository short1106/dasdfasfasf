<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Dulidan Suche</title>
<link rel="icon" href="logo-mark.webp">
<link rel="stylesheet" href="search.css">
<script type="module" src="search.js"></script>
</head>
<body>
  <canvas id="bg" class="bg" aria-hidden="true"></canvas>
  <div class="grid" aria-hidden="true"></div>

  <header class="top" id="top">
    <a class="brand" href="#" id="brand" aria-label="Dulidan"><img src="logo-mark.webp" alt=""><span>DULIDAN<i>SEARCH</i></span></a>
    <form class="sbar" id="form" autocomplete="off" role="search">
      <div class="beam" aria-hidden="true"></div>
      <div class="sbar-in">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Suche mit Dulidan …" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="clear" type="button" id="clear" aria-label="Leeren" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button class="go" type="submit" aria-label="Suchen"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </form>
    <nav class="tabs" id="tabs" role="tablist">
      <button data-t="web" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.6 5.2 3.6 8.5s-1 6.1-3.6 8.5c-2.6-2.4-3.6-5.2-3.6-8.5s1-6.1 3.6-8.5z"/></svg>Alle</button>
      <button data-t="images" role="tab"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-9 8.5"/></svg>Bilder</button>
      <button data-t="videos" role="tab"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9l5 3-5 3z"/></svg>Videos</button>
      <button data-t="news" role="tab"><svg viewBox="0 0 24 24"><path d="M4.5 5.5h12v13h-12zM16.5 9.5h3v7.5a1.5 1.5 0 0 1-3 0M7.5 9h6M7.5 12.5h6M7.5 16h4"/></svg>News</button>
      <span class="ink" id="ink"></span>
    </nav>
  </header>

  <main class="wrap" id="wrap">
    <div class="meta mono" id="meta"></div>
    <section class="side" id="side"></section>
    <section class="list" id="list" aria-live="polite"></section>
    <div class="more mono" id="more"></div>
  </main>

  <div class="lightbox" id="lb" hidden>
    <div class="lb-scrim" data-close></div>
    <figure class="lb-fig">
      <img id="lbImg" alt="">
      <figcaption><b id="lbTitle"></b><span class="mono" id="lbSrc"></span><a id="lbGo" class="btn">Seite öffnen →</a></figcaption>
    </figure>
    <button class="lb-x" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</body>
</html>
